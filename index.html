<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reel Text Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;padding:12px}
h2{font-size:1.1rem;margin:0 0 8px}
.wrap{max-width:460px;margin:auto}
#stage{width:100%;aspect-ratio:9/16;background:#000;border-radius:14px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.box{background:#1e1e1e;border-radius:14px;padding:12px;margin-top:12px}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #333;background:#222;color:#eee;margin:4px 0;font-size:1rem}
input[type=color]{height:44px;padding:4px}
input[type=range]{padding:0}
button{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:1rem;font-weight:600;margin-top:6px}
button.sec{background:#333}
.row{display:flex;gap:8px}.row>*{flex:1}
label{font-size:.85rem;color:#aaa;display:block;margin-top:6px}
.ov{display:flex;justify-content:space-between;align-items:center;background:#262626;padding:8px 10px;border-radius:10px;margin-top:6px;font-size:.9rem}
.ov span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:80%;font-weight:bold}
.ov b{color:#f87171;cursor:pointer;padding:0 4px}
#status{color:#aaa;font-size:.9rem;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <h2>🎬 Reel Text Editor</h2>

  <div id="stage"><canvas id="cv" width="720" height="1280"></canvas></div>
  <audio id="aud"></audio>

  <div class="box">
    <label>1. Image (background)</label>
    <input type="file" id="fImg" accept="image/*">
    <label>2. Song (video length = song length)</label>
    <input type="file" id="fAud" accept="audio/*">
    <label>3. Your own font, .ttf/.otf (optional)</label>
    <input type="file" id="fFont" accept=".ttf,.otf,.woff,.woff2">
    <p id="info" class="muted" style="color:#aaa;font-size:.85rem;margin:6px 0 0"></p>
  </div>

  <div class="box">
    <h2>✍️ Add text overlay</h2>
    <textarea id="oText" rows="2" placeholder="Text (Enter = new line)">रास्ते में</textarea>
    <label>Text color</label>
    <input type="color" id="oColor" value="#ff1a1a">
    <label>Font size: <span id="sizeVal">110</span>px</label>
    <input type="range" id="oSize" min="40" max="200" value="110">
    <select id="oPos">
      <option value="top">Top</option>
      <option value="mid" selected>Middle</option>
      <option value="bottom">Bottom</option>
    </select>
    <div class="row">
      <input type="number" id="oStart" placeholder="Start (sec)" value="0" min="0" step="0.1">
      <input type="number" id="oEnd" placeholder="End (sec, 0 = till end)" value="0" min="0" step="0.1">
    </div>
    <button onclick="addOv()">Add overlay</button>
    <div id="ovList"></div>
  </div>

  <div class="box">
    <button class="sec" id="playBtn" onclick="togglePlay()">▶ Preview</button>
    <button id="expBtn" onclick="exportVid()">⬇ Generate video</button>
    <p id="status">Upload an image and a song to start.</p>
  </div>
</div>

<script>
const W = 720, H = 1280;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const aud = document.getElementById('aud');
const playBtn = document.getElementById('playBtn');
const img = new Image();
let imgReady = false;
let overlays = [];
let fontName = '"Yatra One", sans-serif';
let actx = null, dest = null;

const $ = id => document.getElementById(id);
const st = m => $('status').textContent = m;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- file inputs ---------- */
$('fImg').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  img.onload = () => { imgReady = true; st('Image loaded ✅'); };
  img.src = URL.createObjectURL(f);
};
$('fAud').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  aud.src = URL.createObjectURL(f);
  aud.onloadedmetadata = () => {
    $('info').textContent = `Song length: ${aud.duration.toFixed(1)} sec. Output video will be this long.`;
    st('Song loaded ✅');
  };
};
$('fFont').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const ff = new FontFace('CustomFont', await f.arrayBuffer());
    await ff.load();
    document.fonts.add(ff);
    fontName = '"CustomFont"';
    st('Custom font loaded ✅');
  } catch (err) { st('Font could not load. Try another file.'); }
};
$('oSize').oninput = () => $('sizeVal').textContent = $('oSize').value;

/* ---------- overlays ---------- */
function addOv() {
  const text = $('oText').value.trim();
  if (!text) return st('Enter some text first');
  overlays.push({
    text,
    color: $('oColor').value,
    size: +$('oSize').value,
    pos: $('oPos').value,
    start: +$('oStart').value || 0,
    end: +$('oEnd').value || 0
  });
  renderList();
  st('Overlay added ✅');
}
function delOv(i) { overlays.splice(i, 1); renderList(); }
function renderList() {
  $('ovList').innerHTML = overlays.map((o, i) =>
    `<div class="ov"><span style="color:${o.color}">${esc(o.text.replace(/\n/g, ' '))}</span>
     <b onclick="delOv(${i})">✕</b></div>`).join('');
}

/* ---------- drawing ---------- */
function drawText(o) {
  ctx.font = `${o.size}px ${fontName}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const lines = o.text.split('\n'), lh = o.size * 1.15;
  let y = o.pos === 'top' ? H * 0.2 : o.pos === 'bottom' ? H * 0.8 : H / 2;
  y -= (lines.length - 1) * lh / 2;

  // Black outline with shadow
  ctx.lineJoin = 'round';
  ctx.lineWidth = o.size * 0.16;
  ctx.strokeStyle = '#000';
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = o.size * 0.12;
  ctx.shadowOffsetY = o.size * 0.06;
  lines.forEach((ln, i) => ctx.strokeText(ln, W / 2, y + i * lh));

  // Colored fill on top
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  ctx.fillStyle = o.color;
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, y + i * lh));
}

function drawFrame() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (imgReady) {
    // Cover-fit the image into the 9:16 canvas
    const s = Math.max(W / img.width, H / img.height);
    const dw = img.width * s, dh = img.height * s;
    ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  }
  const t = aud.currentTime;
  overlays.forEach(o => {
    if (t >= o.start && (o.end === 0 || t <= o.end)) drawText(o);
  });
}
function loop() { drawFrame(); requestAnimationFrame(loop); }

/* ---------- audio routing (song goes to speaker and recording) ---------- */
function setupAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  dest = actx.createMediaStreamDestination();
  const src = actx.createMediaElementSource(aud);
  src.connect(actx.destination);
  src.connect(dest);
}

/* ---------- preview ---------- */
function togglePlay() {
  if (!imgReady || !aud.src) return st('Upload an image and a song first');
  setupAudio(); actx.resume();
  if (aud.paused) {
    aud.play();
    playBtn.textContent = '⏸ Pause';
  } else {
    aud.pause();
    playBtn.textContent = '▶ Preview';
  }
}
aud.addEventListener('ended', () => { playBtn.textContent = '▶ Preview'; });

/* ---------- generate video (records canvas + song in real time) ---------- */
function exportVid() {
  if (!imgReady || !aud.src) return st('Upload an image and a song first');
  if (!window.MediaRecorder) return st('Recording not supported. Use Chrome.');
  setupAudio(); actx.resume();

  const type = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
  const stream = new MediaStream([
    ...cv.captureStream(30).getVideoTracks(),
    ...dest.stream.getAudioTracks()
  ]);
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 4000000 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'reel.' + (type.includes('mp4') ? 'mp4' : 'webm');
    a.click();
    playBtn.textContent = '▶ Preview';
    st('Video saved ✅ Check your Downloads folder');
  };

  aud.pause();
  aud.currentTime = 0;
  aud.addEventListener('ended', function onEnd() {
    aud.removeEventListener('ended', onEnd);
    if (rec.state !== 'inactive') rec.stop();
  });
  rec.start();
  aud.play();
  playBtn.textContent = '⏸ Pause';
  st('Generating video... keep this screen open until the song ends');
}

/* ---------- init ---------- */
document.fonts.load('40px "Yatra One"').catch(() => {});
renderList();
loop();
</script>
</body>
</html>
