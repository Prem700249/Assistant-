<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reel Lyric Video (AI)</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;padding:12px}
h2{font-size:1.1rem;margin:0 0 8px}
.wrap{max-width:460px;margin:auto}
#stage{width:100%;aspect-ratio:9/16;background:#000;border-radius:14px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.box{background:#1e1e1e;border-radius:14px;padding:12px;margin-top:12px}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #333;background:#222;color:#eee;margin:4px 0;font-size:1rem}
textarea{min-height:140px;resize:vertical}
button{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:1rem;font-weight:600;margin-top:6px}
button.sec{background:#333}
button:disabled{opacity:.5}
label{font-size:.85rem;color:#aaa;display:block;margin-top:6px}
#status,#info{color:#aaa;font-size:.9rem;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <h2>🎬 Reel Lyric Video (AI)</h2>

  <div id="stage"><canvas id="cv" width="720" height="1280"></canvas></div>
  <audio id="aud"></audio>

  <div class="box">
    <label>1. Image (background)</label>
    <input type="file" id="fImg" accept="image/*">
    <label>2. Song</label>
    <input type="file" id="fAud" accept="audio/*">
    <p id="info"></p>
  </div>

  <div class="box">
    <h2>🤖 AI lyrics</h2>
    <label>Model (tiny = faster, base = more accurate but slower)</label>
    <select id="model">
      <option value="onnx-community/whisper-tiny">Whisper tiny (faster)</option>
      <option value="onnx-community/whisper-base">Whisper base (more accurate)</option>
    </select>
    <button id="transBtn">🎧 Transcribe song with AI</button>
    <label>Lyrics (one line per row, you can edit them)</label>
    <textarea id="lyr" placeholder="Transcribed lines appear here"></textarea>
    <button class="sec" id="autoBtn">⏱ Re-time lines evenly across song</button>
  </div>

  <div class="box">
    <label>Colors for lines, in order (comma separated)</label>
    <input type="text" id="pal" value="#e10600,#ffffff,#ffd400">
    <button class="sec" id="playBtn">▶ Preview</button>
    <button id="genBtn">⬇ Generate video</button>
    <p id="status">Upload an image and a song to start.</p>
  </div>
</div>

<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0";
env.allowLocalModels = false;

const W = 720, H = 1280, MAXW = 640;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const aud = document.getElementById('aud');
const img = new Image();
const $ = id => document.getElementById(id);
const st = m => $('status').textContent = m;
const fontName = '"Yatra One", sans-serif';

let imgReady = false, songFile = null;
let lyr = [];                       // [{text, start}]
let palette = ['#e10600', '#ffffff', '#ffd400'];
let asr = null, asrModel = null, actx = null, dest = null;

/* ---------- inputs ---------- */
$('fImg').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  img.onload = () => { imgReady = true; st('Image loaded ✅'); };
  img.src = URL.createObjectURL(f);
};
$('fAud').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  songFile = f;
  aud.src = URL.createObjectURL(f);
  aud.onloadedmetadata = () => {
    $('info').textContent = `Song length: ${aud.duration.toFixed(1)} sec. Output video will be this long.`;
    st('Song loaded ✅ Now tap "Transcribe song with AI".');
  };
};
$('pal').addEventListener('input', () => {
  palette = $('pal').value.split(',').map(s => s.trim()).filter(Boolean);
  if (!palette.length) palette = ['#ffffff'];
});

function parseLyrics() {
  const lines = $('lyr').value.split('\n').map(s => s.trim()).filter(Boolean);
  const old = lyr;
  lyr = lines.map((text, i) => ({ text, start: old[i] ? old[i].start : NaN }));
}
$('lyr').addEventListener('input', parseLyrics);

/* ---------- AI transcription (runs in the browser) ---------- */
$('transBtn').onclick = async () => {
  if (!songFile) return st('Upload the song first');
  const btn = $('transBtn'); btn.disabled = true;
  try {
    const model = $('model').value;
    if (!asr || asrModel !== model) {
      st('Loading AI model (first time only, needs internet)...');
      asr = await pipeline('automatic-speech-recognition', model, {
        progress_callback: p => {
          if (p.status === 'progress') st(`Downloading model... ${Math.round(p.progress)}%`);
        }
      });
      asrModel = model;
    }
    st('Decoding song...');
    const ac = new AudioContext({ sampleRate: 16000 });
    const buf = await ac.decodeAudioData(await songFile.arrayBuffer());
    const pcm = buf.getChannelData(0);
    ac.close();

    st('AI is listening to the song. This can take a few minutes on a phone. Keep the screen on.');
    const out = await asr(pcm, {
      language: 'hindi', task: 'transcribe', return_timestamps: true,
      chunk_length_s: 30, stride_length_s: 5
    });
    const chunks = (out.chunks || []).filter(c => c.text && c.text.trim());
    lyr = chunks.map(c => ({ text: c.text.trim(), start: c.timestamp[0] ?? 0 }));
    $('lyr').value = lyr.map(l => l.text).join('\n');
    st(`Done ✅ ${lyr.length} lines found. Check and fix the text if needed.`);
  } catch (err) {
    console.error(err);
    st('Transcription failed: ' + (err.message || err) + '. Try again or use the tiny model.');
  }
  btn.disabled = false;
};

/* ---------- fallback timing ---------- */
$('autoBtn').onclick = () => {
  parseLyrics();
  if (!aud.duration) return st('Upload the song first');
  if (!lyr.length) return st('Paste or transcribe lyrics first');
  lyr.forEach((l, i) => l.start = i * aud.duration / lyr.length);
  st('Lines timed evenly ✅');
};

/* ---------- text drawing (auto size + wrap) ---------- */
function wrapText(text, size) {
  ctx.font = `${size}px ${fontName}`;
  const words = text.split(/\s+/), out = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > MAXW && line) { out.push(line); line = w; }
    else line = test;
  }
  if (line) out.push(line);
  return out;
}
function fitText(text) {
  let size = 150, ls;
  for (; size > 60; size -= 6) {
    ls = wrapText(text, size);
    if (ls.length <= 3) break;
  }
  return { size, lines: ls };
}
function drawLyric(i, t) {
  const { size, lines } = fitText(lyr[i].text);
  const pop = Math.min(1, (t - lyr[i].start) / 0.18);
  const sc = 1.12 - 0.12 * pop;
  const lh = size * 1.1, cy = H * 0.27;
  const color = palette[i % palette.length];
  const y0 = -(lines.length - 1) * lh / 2;

  ctx.save();
  ctx.translate(W / 2, cy);
  ctx.scale(sc, sc);
  ctx.font = `${size}px ${fontName}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';

  ctx.lineWidth = size * 0.22;
  ctx.strokeStyle = '#000';
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = size * 0.15;
  ctx.shadowOffsetY = size * 0.08;
  lines.forEach((l, k) => ctx.strokeText(l, 0, y0 + k * lh));

  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  ctx.fillStyle = color;
  lines.forEach((l, k) => ctx.fillText(l, 0, y0 + k * lh));
  ctx.restore();
}
function activeLine(t) {
  let cur = null;
  lyr.forEach((l, i) => { if (!isNaN(l.start) && t >= l.start) cur = i; });
  return cur;
}
function drawFrame() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (imgReady) {
    const s = Math.max(W / img.width, H / img.height);
    const dw = img.width * s, dh = img.height * s;
    ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  }
  const t = aud.currentTime;
  const cur = activeLine(t);
  if (cur !== null) drawLyric(cur, t);
}
function loop() { drawFrame(); requestAnimationFrame(loop); }

/* ---------- audio routing (speaker + recording) ---------- */
function setupAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  dest = actx.createMediaStreamDestination();
  const src = actx.createMediaElementSource(aud);
  src.connect(actx.destination);
  src.connect(dest);
}

/* ---------- preview ---------- */
$('playBtn').onclick = () => {
  if (!imgReady || !aud.src) return st('Upload an image and a song first');
  setupAudio(); actx.resume();
  if (aud.paused) { aud.play(); $('playBtn').textContent = '⏸ Pause'; }
  else { aud.pause(); $('playBtn').textContent = '▶ Preview'; }
};
aud.addEventListener('ended', () => $('playBtn').textContent = '▶ Preview');

/* ---------- generate video (real time) ---------- */
$('genBtn').onclick = () => {
  parseLyrics();
  if (!imgReady || !aud.src) return st('Upload an image and a song first');
  if (!lyr.some(l => !isNaN(l.start))) return st('Transcribe the song first (or use re-time)');
  if (!window.MediaRecorder) return st('Recording not supported. Use Chrome.');
  setupAudio(); actx.resume();

  const type = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
  const stream = new MediaStream([
    ...cv.captureStream(30).getVideoTracks(),
    ...dest.stream.getAudioTracks()
  ]);
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 4000000 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'reel.' + (type.includes('mp4') ? 'mp4' : 'webm');
    a.click();
    $('playBtn').textContent = '▶ Preview';
    st('Video saved ✅ Check your Downloads folder');
  };

  aud.pause();
  aud.currentTime = 0;
  aud.addEventListener('ended', function onEnd() {
    aud.removeEventListener('ended', onEnd);
    if (rec.state !== 'inactive') rec.stop();
  });
  rec.start();
  aud.play();
  $('playBtn').textContent = '⏸ Pause';
  st('Generating video... keep this screen open until the song ends');
};

document.fonts.load('40px "Yatra One"').catch(() => {});
loop();
</script>
</body>
</html>
